  body{margin:0;font-family:'Space Grotesk','Inter',sans-serif;}
  .font-mono-cyber{font-family:'JetBrains Mono',ui-monospace,monospace;}
  @keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  .float-med{animation:float-y 4.2s ease-in-out infinite;}

  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(34,230,255,0.45);}100%{box-shadow:0 0 0 22px rgba(34,230,255,0);}}

  @keyframes blink{50%{opacity:0;}}

  @media (prefers-reduced-motion: reduce){

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const COLORS = { void:"#030014", panel:"rgba(255,255,255,0.04)", panelBorder:"rgba(255,255,255,0.08)", cyan:"#22e6ff", purple:"#a855f7", red:"#ff2954" };
const NIGHT_COLORS = { void:"#0a0014", panel:"rgba(255,255,255,0.05)", panelBorder:"rgba(255,42,120,0.25)", cyan:"#ff2fa0", purple:"#7c3aed", red:"#ff2954" };

function Icon({ children, size = 18, color }) {
  return <span style={{ fontSize: size, lineHeight: 1, color, display: "inline-block" }}>{children}</span>;
}

function AbhaNeuralLink(){
  const [nightMode, setNightMode] = useState(false);
  const [syncMode, setSyncMode] = useState(false);
  const [showVoid, setShowVoid] = useState(false);
  const C = nightMode ? NIGHT_COLORS : COLORS;

  useEffect(() => {
    const hour = new Date().getHours();
    if (hour >= 0 && hour < 5) setNightMode(true);
  }, []);

  return (
    <div className="relative min-h-screen w-full overflow-x-hidden text-white transition-colors duration-700" style={{ background: C.void }}>
      {!syncMode && <BackgroundField C={C} />}
      <TerminalHack C={C} />
      <NightOwlBanner nightMode={nightMode} />
      <BootSequenceHero C={C} syncMode={syncMode} />
      {!syncMode && <SkillTree C={C} />}
      {!syncMode && <CyberStats C={C} />}
      {nightMode && !syncMode && <MidnightNotes C={C} />}
      <ControlDock C={C} nightMode={nightMode} setNightMode={setNightMode} syncMode={syncMode} setSyncMode={setSyncMode} setShowVoid={setShowVoid} />
      <FloatingOrb C={C} syncMode={syncMode} />
      {showVoid && <ZeroGravityVoid C={C} onClose={() => setShowVoid(false)} />}
      <footer className="relative z-10 border-t px-6 py-10 text-center" style={{ borderColor:"rgba(255,255,255,0.08)" }}>
        <p className="font-mono-cyber text-xs tracking-widest text-white/40">ABHA ACADEMY · NEURAL LINK BUILD · HOLAMBI KALAN, DELHI</p>
      </footer>
    </div>
  );
}

function BackgroundField({ C }){
  const particles = Array.from({ length: 22 });
  return (
    <div className="pointer-events-none fixed inset-0 z-0 overflow-hidden">
      <div className="absolute inset-0 opacity-30" style={{ backgroundImage:"linear-gradient(rgba(34,230,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(34,230,255,0.06) 1px, transparent 1px)", backgroundSize:"42px 42px", maskImage:"radial-gradient(ellipse 70% 60% at 50% 20%, black 40%, transparent 100%)" }} />
      <div className="absolute -top-40 -left-40 h-96 w-96 rounded-full blur-3xl" style={{ background:`radial-gradient(circle, ${C.purple}33, transparent 70%)` }} />
      <div className="absolute -bottom-40 -right-40 h-96 w-96 rounded-full blur-3xl" style={{ background:`radial-gradient(circle, ${C.cyan}2a, transparent 70%)` }} />
      {particles.map((_, i) => (
        <span key={i} className="absolute rounded-full float-slow" style={{ left:`${(i*37)%100}%`, top:`${(i*53)%100}%`, width:2+(i%3), height:2+(i%3), background:i%3===0?C.cyan:i%3===1?C.purple:C.red, opacity:0.5, animationDelay:`${(i%7)*0.6}s`, animationDuration:`${5+(i%5)}s` }} />
      ))}
    </div>
  );
}

const SECRET_CODE = ["a","b","h","a","2","0","8","6"];
const PUZZLES = [
  { q:"12 x 8 = ?", a:"96" },
  { q:"Next in sequence: 2, 4, 8, 16, ?", a:"32" },
  { q:"If today is Monday, what day is it in 10 days?", a:"thursday" },
  { q:"Binary 101 in decimal = ?", a:"5" },
  { q:"A train covers 60km in 1hr. Distance in 45 min?", a:"45" },
];

function TerminalHack({ C }){
  const [open, setOpen] = useState(false);
  const [glitching, setGlitching] = useState(false);
  const bufferRef = useRef([]);
  const [puzzle] = useState(() => PUZZLES[Math.floor(Math.random()*PUZZLES.length)]);
  const [input, setInput] = useState("");
  const [seconds, setSeconds] = useState(30);
  const [result, setResult] = useState(null);

  useEffect(() => {
    function onKey(e){
      const k = e.key.toLowerCase();
      bufferRef.current = [...bufferRef.current, k].slice(-SECRET_CODE.length);
      if (bufferRef.current.join("") === SECRET_CODE.join("")) {
        setGlitching(true);
        setTimeout(() => { setGlitching(false); setOpen(true); }, 700);
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  useEffect(() => {
    if (!open || result) return;
    if (seconds <= 0) { setResult("lost"); return; }
    const t = setTimeout(() => setSeconds(s => s-1), 1000);
    return () => clearTimeout(t);
  }, [open, seconds, result]);

  function submit(){
    setResult(input.trim().toLowerCase() === puzzle.a.toLowerCase() ? "won" : "lost");
  }
  function close(){
    setOpen(false); setResult(null); setInput(""); setSeconds(30); bufferRef.current = [];
  }

  return (
    <>
      {glitching && <div className="glitch-flash fixed inset-0 z-[200] bg-white mix-blend-difference" />}
      {open && (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/90 p-6 backdrop-blur-sm">
          <div className="font-mono-cyber w-full max-w-md rounded-xl border p-6 text-sm" style={{ borderColor:C.cyan, background:"#020010", boxShadow:`0 0 40px ${C.cyan}55` }}>
            <div className="mb-3 flex items-center justify-between" style={{ color:C.cyan }}>
              <span className="flex items-center gap-2"><Icon size={14}>⌨️</Icon> ROOT ACCESS — ABHA::TERMINAL</span>
              <button onClick={close} aria-label="Close"><Icon size={16}>✕</Icon></button>
            </div>
            {result === null && (
              <>
                <p className="mb-2 text-white/70">&gt; secret sequence accepted.</p>
                <p className="mb-2 text-white/70">&gt; solve to decrypt CYBER-SCHOLAR badge:</p>
                <p className="mb-4 text-lg text-white">{puzzle.q}</p>
                <input autoFocus value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
                  className="mb-3 w-full rounded border bg-black/60 px-3 py-2 text-white outline-none" style={{ borderColor:C.panelBorder }} placeholder="answer_" />
                <div className="flex items-center justify-between">
                  <span style={{ color: seconds<=10?C.red:"white" }}>{seconds}s remaining</span>
                  <button onClick={submit} className="rounded-full px-4 py-1.5 text-black" style={{ background:C.cyan }}>DECRYPT</button>
                </div>
              </>
            )}
            {result === "won" && (
              <div className="text-center">
                <p className="mb-2 text-lg" style={{ color:C.cyan }}>ACCESS GRANTED</p>
                <p className="mb-4 text-white/80">You've earned the <b>CYBER-SCHOLAR</b> badge. Show this at ABHA Academy for priority evening batch placement.</p>
                <p className="mb-4 rounded border px-3 py-2 tracking-widest" style={{ borderColor:C.cyan, color:C.cyan }}>CODE: ABHA-SCHOLAR-{puzzle.a.toUpperCase().slice(0,3)}86</p>
                <button onClick={close} className="rounded-full px-4 py-1.5 text-black" style={{ background:C.cyan }}>CLOSE</button>
              </div>
            )}
            {result === "lost" && (
              <div className="text-center">
                <p className="mb-2 text-lg" style={{ color:C.red }}>CONNECTION LOST</p>
                <p className="mb-4 text-white/70">Correct answer was: <b>{puzzle.a}</b>. Type ABHA2086 again to retry.</p>
                <button onClick={close} className="rounded-full px-4 py-1.5 text-black" style={{ background:C.red }}>CLOSE</button>
              </div>
            )}
          </div>
        </div>
      )}
    </>
  );
}

function ZeroGravityVoid({ C, onClose }){
  const targets = [
    { id:"p", letter:"P", tx:20, ty:50 }, { id:"a", letter:"A", tx:32, ty:50 },
    { id:"g", letter:"G", tx:44, ty:50 }, { id:"e", letter:"E", tx:56, ty:50 },
    { id:"4", letter:"4", tx:68, ty:50 }, { id:"0", letter:"0", tx:80, ty:50 },
  ];
  const [pieces, setPieces] = useState(targets.map(t => ({ ...t, x:10+Math.random()*80, y:10+Math.random()*30, placed:false })));
  const [repaired, setRepaired] = useState(false);
  const dragRef = useRef(null);

  function onPointerDown(id){ dragRef.current = { id }; }
  function onPointerMove(e){
    if (!dragRef.current) return;
    const rect = e.currentTarget.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX; clientY = e.clientY;
    }
    const x = ((clientX-rect.left)/rect.width)*100;
    const y = ((clientY-rect.top)/rect.height)*100;
    setPieces(prev => prev.map(p => p.id===dragRef.current.id ? { ...p, x, y } : p));
  }
  function onPointerUp(){
    if (!dragRef.current) return;
    const id = dragRef.current.id;
    setPieces(prev => {
      const next = prev.map(p => {
        if (p.id!==id) return p;
        const dist = Math.hypot(p.x-p.tx, p.y-p.ty);
        return dist<7 ? { ...p, x:p.tx, y:p.ty, placed:true } : p;
      });
      if (next.every(p=>p.placed)) setRepaired(true);
      return next;
    });
    dragRef.current = null;
  }

  return (
    <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black p-6">
      <p className="font-mono-cyber mb-4 text-center text-sm" style={{ color:C.red }}>404 — GRAVITY OFFLINE. Drag each glyph back into its slot to repair the page.</p>
      <div className="relative h-72 w-full max-w-xl touch-none select-none rounded-xl border" style={{ borderColor:C.panelBorder, background:"rgba(255,255,255,0.02)" }}
        onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
        onTouchMove={onPointerMove} onTouchEnd={onPointerUp}>
        {targets.map(t => (
          <div key={t.id} className="font-mono-cyber absolute flex h-10 w-10 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded border border-dashed text-white/20" style={{ left:`${t.tx}%`, top:`${t.ty}%`, borderColor:C.panelBorder }}>{t.letter}</div>
        ))}
        {pieces.map(p => (
          <button key={p.id} onPointerDown={()=>onPointerDown(p.id)} onTouchStart={()=>onPointerDown(p.id)}
            className={`font-mono-cyber absolute flex h-10 w-10 -translate-x-1/2 -translate-y-1/2 cursor-grab items-center justify-center rounded-full border-2 font-bold active:cursor-grabbing ${!p.placed?"float-fast":""}`}
            style={{ left:`${p.x}%`, top:`${p.y}%`, borderColor:p.placed?C.cyan:C.purple, background:p.placed?`${C.cyan}22`:`${C.purple}22`, color:"white", transition:p.placed?"left 0.2s, top 0.2s":"none" }}>
            {p.letter}
          </button>
        ))}
      </div>
      {repaired ? (
        <div className="mt-6 max-w-md rounded-xl border p-5 text-center" style={{ borderColor:C.cyan, background:C.panel }}>
          <p className="mb-2 font-mono-cyber text-sm" style={{ color:C.cyan }}>PAGE REPAIRED</p>
          <p className="mb-4 text-sm text-white/80">Secret stash unlocked: quick revision notes for English, Maths &amp; Computer are waiting at ABHA Academy — ask your teacher for the "404 Repair" handout.</p>
          <button onClick={onClose} className="rounded-full px-5 py-2 text-black" style={{ background:C.cyan }}>RETURN TO SITE</button>
        </div>
      ) : (
        <button onClick={onClose} className="mt-6 font-mono-cyber text-xs text-white/50 underline">skip / close</button>
      )}
    </div>
  );
}

function useAmbientTone(active){
  const ctxRef = useRef(null);
  useEffect(() => {
    if (!active) { if (ctxRef.current){ ctxRef.current.ctx.close(); ctxRef.current=null; } return; }
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const osc1 = ctx.createOscillator(); const osc2 = ctx.createOscillator();
      osc1.frequency.value = 110; osc2.frequency.value = 114;
      const gain = ctx.createGain(); gain.gain.value = 0.025;
      osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
      osc1.start(); osc2.start();
      ctxRef.current = { ctx, osc1, osc2 };
    } catch(err){}
    return () => { if (ctxRef.current){ try{ ctxRef.current.ctx.close(); }catch(e){} ctxRef.current=null; } };
  }, [active]);
}

function FocusHealthBar({ active, C }){
  const [seconds, setSeconds] = useState(0);
  const CAP = 25*60;
  useEffect(() => {
    if (!active) { setSeconds(0); return; }
    const id = setInterval(() => { if (document.visibilityState==="visible") setSeconds(s=>Math.min(s+1,CAP)); }, 1000);
    return () => clearInterval(id);
  }, [active]);
  if (!active) return null;
  const pct = (seconds/CAP)*100;
  const mm = String(Math.floor(seconds/60)).padStart(2,"0");
  const ss = String(seconds%60).padStart(2,"0");
  return (
    <div className="font-mono-cyber fixed left-1/2 top-4 z-50 w-64 -translate-x-1/2 rounded-full border px-4 py-2 text-[10px]" style={{ borderColor:C.panelBorder, background:"rgba(0,0,0,0.6)" }}>
      <div className="mb-1 flex justify-between text-white/60"><span>FOCUS HEALTH</span><span>{mm}:{ss}</span></div>
      <div className="h-1.5 w-full overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full" style={{ width:`${pct}%`, background:C.cyan, transition:"width 1s linear" }} /></div>
    </div>
  );
}

  const [show, setShow] = useState(false);

        </button>
        <button onClick={()=>setNightMode(n=>!n)} className="flex items-center gap-2 rounded-full border px-3 py-2 backdrop-blur-md transition-colors"
          style={{ borderColor:nightMode?C.red:C.panelBorder, background:nightMode?`${C.red}22`:"rgba(0,0,0,0.4)", color:nightMode?C.red:"white" }}>
          <Icon size={12}>🌙</Icon> NIGHT OWL PREVIEW
        </button>
        <button onClick={()=>setShowVoid(true)} className="flex items-center gap-2 rounded-full border px-3 py-2 backdrop-blur-md text-white/70" style={{ borderColor:C.panelBorder, background:"rgba(0,0,0,0.4)" }}>
          <Icon size={12}>↺</Icon> SIMULATE 404 VOID
        </button>

}

function BootSequenceHero({ C, syncMode }){
  const bootLines = [
    "> initializing abha academy neural link...",
    "> authenticating local node — holambi kalan, delhi",
    "> loading curriculum modules: english / maths / computer",

        </div>
        <h1 className="relative select-none text-5xl font-bold leading-[0.95] tracking-tight sm:text-7xl md:text-8xl">
          {!syncMode && (<>
            <span className="glitch-layer absolute inset-0" style={{ color:C.red, animationDelay:"0.15s", opacity:0.6 }} aria-hidden="true">ABHA ACADEMY</span>
            <span className="glitch-layer absolute inset-0" style={{ color:C.cyan, animationDelay:"0.3s", opacity:0.6 }} aria-hidden="true">ABHA ACADEMY</span>

        <div className="float-med relative mt-12 max-w-xl rounded-3xl border p-8 backdrop-blur-xl" style={{ borderColor:C.panelBorder, background:C.panel }}>

function SkillTree({ C }){
  const SKILLS = [
    { id:"core", label:"FOUNDATION CORE", emoji:"🧠", x:50, y:50, color:C.purple, desc:"The shared root — every subject at ABHA is taught to build durable fundamentals, not memorised shortcuts." },
    { id:"english", label:"ENGLISH", emoji:"📖", x:18, y:20, color:C.cyan, desc:"Reading, handwriting and spoken confidence — built through stories, not just textbooks." },
    { id:"maths", label:"MATHEMATICS", emoji:"🔢", x:82, y:20, color:C.red, desc:"Tables, arithmetic and logical thinking, practised until the basics are genuinely secure." },
    { id:"computer", label:"COMPUTER BASICS", emoji:"💻", x:50, y:88, color:C.cyan, desc:"Typing, mouse and keyboard fluency, and the digital skills every child will need going forward." },
  ];
  const EDGES = [["core","english"],["core","maths"],["core","computer"]];
  const [active, setActive] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(entries=>entries.forEach(e=>e.isIntersecting&&setRevealed(true)), { threshold:0.2 });
    obs.observe(el); return ()=>obs.disconnect();
  }, []);
  const findSkill = id => SKILLS.find(s=>s.id===id);

  return (
    <section id="skill-tree" ref={ref} className="relative z-10 mx-auto max-w-5xl px-6 py-28">
      <div className={`reveal ${revealed?"in":""} mb-16 text-center`}>
        <p className="font-mono-cyber text-xs tracking-[0.3em]" style={{ color:`${C.cyan}b3` }}>CURRICULUM MAP</p>
        <h2 className="mt-3 text-3xl font-bold sm:text-4xl">Not subjects. A network of foundations.</h2>
      </div>
      <div className={`reveal ${revealed?"in":""} relative mx-auto aspect-square w-full max-w-2xl`}>
        <svg className="absolute inset-0 h-full w-full" viewBox="0 0 100 100" preserveAspectRatio="none">
          {EDGES.map(([a,b],i)=>{
            const from=findSkill(a), to=findSkill(b), isActive=active===a||active===b;
            return <line key={i} x1={from.x} y1={from.y} x2={to.x} y2={to.y} stroke={isActive?C.cyan:"rgba(255,255,255,0.12)"} strokeWidth={isActive?0.6:0.3} className={isActive?"flow-line":""} style={{ transition:"stroke 0.3s, stroke-width 0.3s", filter: isActive ? `drop-shadow(0 0 4px ${C.cyan})` : "none" }} />;
          })}
        </svg>
        {SKILLS.map(skill=>{
          const isActive = active===skill.id;
          return (
            <button key={skill.id} onMouseEnter={()=>setActive(skill.id)} onMouseLeave={()=>setActive(null)} onClick={()=>setActive(isActive?null:skill.id)}
              className="absolute flex -translate-x-1/2 -translate-y-1/2 flex-col items-center gap-2 outline-none" style={{ left:`${skill.x}%`, top:`${skill.y}%` }}>
              <span className={`pulse-ring flex items-center justify-center rounded-full border-2 backdrop-blur-md transition-all duration-300 ${skill.id==="core"?"h-20 w-20 sm:h-24 sm:w-24":"h-16 w-16 sm:h-20 sm:w-20"}`}
                style={{ borderColor:skill.color, background:isActive?`${skill.color}22`:"rgba(255,255,255,0.03)", boxShadow:isActive?`0 0 30px ${skill.color}88`:`0 0 12px ${skill.color}33`, transform:isActive?"scale(1.12)":"scale(1)" }}>
                <Icon size={skill.id==="core"?30:24}>{skill.emoji}</Icon>
              </span>
              <span className="font-mono-cyber text-[10px] tracking-wider text-white/70 sm:text-xs">{skill.label}</span>
            </button>
          );
        })}
      </div>
      <div className="mx-auto mt-10 max-w-md rounded-2xl border p-6 text-center backdrop-blur-xl transition-all duration-300" style={{ borderColor:C.panelBorder, background:C.panel, opacity:active?1:0.35, transform:active?"translateY(0)":"translateY(6px)" }}>
        <p className="text-sm leading-relaxed text-white/85">{active?findSkill(active).desc:"Hover or tap a node to inspect its module."}</p>
      </div>
    </section>
  );
}

function useCountUp(target, active, duration=1400){
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start=null, raf;
    const step = ts => { if(!start) start=ts; const progress=Math.min((ts-start)/duration,1); setValue(Math.round(target*(1-Math.pow(1-progress,3)))); if(progress<1) raf=requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [active, target, duration]);
  return value;
}

function ProgressRing({ percent, active, color, label, emoji, suffix="%" }){
  const radius=42, circumference=2*Math.PI*radius;
  const displayed = useCountUp(percent, active);
  const offset = circumference - (displayed/100)*circumference;
  return (
    <div className="flex flex-col items-center gap-4">
      <div className="relative h-32 w-32">
        <svg className="h-full w-full -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={radius} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="6" />
          <circle cx="50" cy="50" r={radius} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={active?offset:circumference} style={{ transition:"stroke-dashoffset 1.4s ease-out", filter:`drop-shadow(0 0 6px ${color})` }} />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <Icon size={18} color={color}>{emoji}</Icon>
          <span className="font-mono-cyber text-xl font-bold text-white">{displayed}{suffix}</span>
        </div>
      </div>
      <p className="font-mono-cyber text-center text-xs tracking-wide text-white/60">{label}</p>
    </div>
  );
}

function FloatingOrb({ C, syncMode }){
  const [open, setOpen] = useState(false);
  const [annoyed, setAnnoyed] = useState(false);
  const [shake, setShake] = useState(false);
  const [challenge, setChallenge] = useState(null);
  const clickTimes = useRef([]);
  const links = [
    { label:"Skill Tree", href:"#skill-tree" },
    { label:"Enrol on WhatsApp", href:"https://wa.me/916394254410" },
    { label:"Call", href:"tel:+916394254410" },
  ];

  function handleOrbClick(){
    const now = Date.now();
    clickTimes.current = [...clickTimes.current, now].filter(t=>now-t<6000);
    setShake(true); setTimeout(()=>setShake(false),400);
    if (clickTimes.current.length>=10 && !annoyed){
      setAnnoyed(true); setChallenge(PUZZLES[Math.floor(Math.random()*PUZZLES.length)]); setOpen(false); return;
    }
    if (!annoyed) setOpen(o=>!o);
  }

  if (syncMode) return null;

  return (
    <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">
      {open && !annoyed && (
        <div className="reveal in font-mono-cyber flex flex-col gap-1 rounded-2xl border p-3 text-xs backdrop-blur-xl" style={{ borderColor:C.panelBorder, background:"rgba(3,0,20,0.85)" }}>
          {links.map(l=>(
            <a key={l.label} href={l.href} target={l.href.startsWith("http")?"_blank":undefined} rel="noopener noreferrer"
              className="flex items-center gap-2 rounded-lg px-3 py-2 text-white/80 transition-colors hover:bg-white/5" onClick={()=>setOpen(false)}>
              <Icon size={12}>›</Icon> {l.label}
            </a>
          ))}
        </div>
      )}
      {annoyed && challenge && (
        <div className="reveal in font-mono-cyber w-64 rounded-2xl border p-4 text-xs" style={{ borderColor:C.red, background:"rgba(20,0,5,0.9)" }}>
          <p className="mb-2" style={{ color:C.red }}>Stop playing with the interface. Your exams are coming. Solve this:</p>
          <p className="mb-3 text-sm text-white">{challenge.q}</p>
          <AnnoyedAnswer C={C} challenge={challenge} onDone={()=>{ setAnnoyed(false); setChallenge(null); clickTimes.current=[]; }} />
        </div>
      )}
      <button onClick={handleOrbClick} aria-label="Neural link assistant" className={`float-slow pulse-ring relative flex h-16 w-16 items-center justify-center rounded-full border-2 backdrop-blur-md transition-transform hover:scale-110 ${shake?"shake":""}`}
        style={{ borderColor:annoyed?C.red:C.cyan, background:annoyed?`radial-gradient(circle at 30% 30%, ${C.red}66, ${C.red}22)`:`radial-gradient(circle at 30% 30%, ${C.cyan}55, ${C.purple}33)` }}>
        <Icon size={22} color="#fff">{open && !annoyed ? "✕" : "✨"}</Icon>
      </button>
    </div>
  );
}

function AnnoyedAnswer({ C, challenge, onDone }){
  const [val, setVal] = useState("");
  const [msg, setMsg] = useState(null);
  function submit(){
    const correct = val.trim().toLowerCase() === challenge.a.toLowerCase();
    setMsg(correct ? "Correct. I'll allow it." : `Wrong. It was ${challenge.a}. Go revise.`);
    setTimeout(onDone, 1600);
  }
  if (msg) return <p style={{ color:C.cyan }}>{msg}</p>;
  return (
    <div className="flex gap-2">
      <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} className="w-full rounded border bg-black/60 px-2 py-1 text-white outline-none" style={{ borderColor:C.panelBorder }} />
      <button onClick={submit} className="rounded px-3 text-black" style={{ background:C.red }}>GO</button>
    </div>
  );
}
