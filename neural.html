<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABHA Academy — Neural Link 2086</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom-client.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --cyan: #22e6ff; --purple: #a855f7; --red: #ff2954; --void: #030014; }
        body { margin: 0; background: var(--void); color: white; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
        .font-mono-cyber { font-family: 'JetBrains Mono', monospace; }
        
        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .float { animation: float 5s ease-in-out infinite; }
        
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scanline::after {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background: linear-gradient(to bottom, transparent, rgba(34,230,255,0.03) 50%, transparent);
            animation: scanline 8s linear infinite; z-index: 100;
        }

        .glitch-text { position: relative; }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .glitch-text::before { color: var(--cyan); z-index: -1; animation: glitch 3s infinite; }
        .glitch-text::after { color: var(--red); z-index: -2; animation: glitch 2s infinite reverse; }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); }
        .pulse-cyan { box-shadow: 0 0 20px rgba(34,230,255,0.2); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--void); }
        ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="scanline">
    <div id="root"></div>

    <script type="text/javascript" data-presets="react">
        const { useState, useEffect, useRef, useMemo } = React;

        const THEMES = {
            day: { void: "#030014", accent: "#22e6ff", secondary: "#a855f7", text: "#ffffff" },
            night: { void: "#0a0014", accent: "#ff2fa0", secondary: "#7c3aed", text: "#ffcfe6" }
        };

        const PUZZLES = [
            { q: "Square root of 144?", a: "12" },
            { q: "Opposite of 'Difficult'?", a: "easy" },
            { q: "Binary for 4? (3 bits)", a: "100" },
            { q: "Capital of India?", a: "delhi" }
        ];

        // --- COMPONENTS ---

        function Icon({ name, size = 18, color = "currentColor" }) {
            const icons = {
                sync: "🎚️", moon: "🌙", sun: "☀️", x: "✕", star: "✨", 
                math: "🔢", eng: "📖", comp: "💻", core: "🧠", arrow: "›"
            };
            return <span style={{ fontSize: size, color }}>{icons[name] || name}</span>;
        }

        function AbhaApp() {
            const [mode, setMode] = useState('day');
            const [sync, setSync] = useState(false);
            const [isBooted, setIsBooted] = useState(false);
            const [showVoid, setShowVoid] = useState(false);
            const colors = THEMES[mode];

            return (
                <div className="relative min-h-screen transition-colors duration-1000" style={{ background: colors.void }}>
                    <BackgroundGrid color={colors.accent} />
                    
                    {!isBooted ? (
                        <BootSequence onComplete={() => setIsBooted(true)} color={colors.accent} />
                    ) : (
                        <>
                            <nav className="fixed top-0 w-full z-50 p-6 flex justify-between items-center bg-gradient-to-b from-black/50 to-transparent">
                                <div className="font-mono-cyber text-xs tracking-tighter" style={{ color: colors.accent }}>
                                    ABHA_ACADEMY // NODE_011
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setMode(m => m === 'day' ? 'night' : 'day')} className="p-2 glass rounded-full">
                                        <Icon name={mode === 'day' ? 'moon' : 'sun'} />
                                    </button>
                                </div>
                            </nav>

                            <main className="relative z-10 pt-20">
                                <Hero colors={colors} sync={sync} />
                                <SkillTree colors={colors} />
                                <Stats colors={colors} />
                                <ContactSection colors={colors} />
                            </main>

                            <ControlDock 
                                colors={colors} 
                                sync={sync} 
                                setSync={setSync} 
                                onVoidTrigger={() => setShowVoid(true)} 
                            />
                            
                            <Terminal colors={colors} />
                            {showVoid && <GravityVoid colors={colors} onClose={() => setShowVoid(false)} />}
                            <FloatingAssistant colors={colors} />
                        </>
                    )}
                </div>
            );
        }

        function BootSequence({ onComplete, color }) {
            const [lines, setLines] = useState([]);
            const bootText = [
                "> Initiating ABHA Neural Link...",
                "> Locating Holambi Kalan Sector...",
                "> Connecting to Education Hub...",
                "> Loading English/Maths/JS Modules...",
                "> Status: FREE ACCESS GRANTED."
            ];

            useEffect(() => {
                let current = 0;
                const interval = setInterval(() => {
                    if (current < bootText.length) {
                        setLines(prev => [...prev, bootText[current]]);
                        current++;
                    } else {
                        clearInterval(interval);
                        setTimeout(onComplete, 1000);
                    }
                }, 500);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="fixed inset-0 flex items-center justify-center p-10 font-mono-cyber text-sm">
                    <div className="max-w-md w-full">
                        {lines.map((line, i) => (
                            <div key={i} style={{ color }} className="mb-2">{line}</div>
                        ))}
                        <div className="h-1 w-full bg-white/10 mt-4 overflow-hidden">
                            <div className="h-full transition-all duration-300" style={{ width: `${(lines.length/bootText.length)*100}%`, background: color }} />
                        </div>
                    </div>
                </div>
            );
        }

        function Hero({ colors, sync }) {
            return (
                <section className="px-6 py-20 flex flex-col items-center text-center">
                    <div className="inline-block glass px-4 py-1 rounded-full text-[10px] mb-6 font-mono-cyber" style={{ color: colors.accent }}>
                        EST. 2024 • THE FUTURE OF FREE EDUCATION
                    </div>
                    <h1 className="text-6xl md:text-8xl font-bold tracking-tighter mb-6 glitch-text" data-text="ABHA ACADEMY">
                        ABHA ACADEMY
                    </h1>
                    <p className="max-w-2xl text-lg text-white/70 leading-relaxed">
                        An evening learning node for students (Class 0-8). High-quality foundation in <span style={{ color: colors.accent }}>English</span>, <span style={{ color: colors.secondary }}>Mathematics</span>, and <span style={{ color: colors.accent }}>Digital Literacy</span>.
                    </p>
                    <div className="mt-10 flex flex-wrap gap-4 justify-center">
                        <a href="https://wa.me/916394254410" className="px-8 py-3 rounded-full font-bold text-black transition-transform hover:scale-105" style={{ background: colors.accent }}>
                            ENROLL NOW
                        </a>
                        <button className="px-8 py-3 rounded-full border border-white/20 hover:bg-white/5 transition-colors">
                            VIEW CURRICULUM
                        </button>
                    </div>
                </section>
            );
        }

        function SkillTree({ colors }) {
            const skills = [
                { id: 1, name: "English", icon: "eng", desc: "Grammar, Handwriting & Conversation", pos: "md:translate-x-[-150px]" },
                { id: 2, name: "Mathematics", icon: "math", desc: "Mental Math, Tables & Logic", pos: "md:translate-x-[150px]" },
                { id: 3, name: "Computing", icon: "comp", desc: "Typing, Internet & Basic Coding", pos: "md:translate-y-[100px]" }
            ];

            return (
                <section className="py-20 px-6 max-w-6xl mx-auto">
                    <h2 className="text-center font-mono-cyber text-sm mb-16" style={{ color: colors.accent }}>// CORE_MODULES</h2>
                    <div className="flex flex-col md:flex-row items-center justify-center gap-10">
                        {skills.map(s => (
                            <div key={s.id} className={`glass p-8 rounded-3xl w-full md:w-64 text-center hover:border-[${colors.accent}] transition-all group hover:-translate-y-2`}>
                                <div className="text-4xl mb-4 group-hover:scale-110 transition-transform"><Icon name={s.icon} size={40} /></div>
                                <h3 className="font-bold text-xl mb-2">{s.name}</h3>
                                <p className="text-sm text-white/50">{s.desc}</p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        function ContactSection({ colors }) {
            return (
                <section className="py-20 px-6 bg-white/5">
                    <div className="max-w-4xl mx-auto glass p-10 rounded-3xl border-dashed">
                        <div className="grid md:grid-cols-2 gap-10 items-center">
                            <div>
                                <h2 className="text-3xl font-bold mb-4">Visit Node 01</h2>
                                <p className="text-white/60 mb-6">Open every evening for students of Class 0 to 8. Zero fees, 100% dedication.</p>
                                <div className="space-y-4 font-mono-cyber text-sm">
                                    <div className="flex items-center gap-3">
                                        <span style={{ color: colors.accent }}>📍</span> Holambi Kalan, Delhi
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span style={{ color: colors.accent }}>📞</span> +91 6394254410
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span style={{ color: colors.accent }}>⏰</span> 18:00 - 22:00 (Mon-Sat)
                                    </div>
                                </div>
                            </div>
                            <div className="h-48 rounded-2xl bg-black/40 border border-white/10 flex items-center justify-center text-white/20 text-xs">
                                MAP_VIEW_DISABLED_IN_CONCEPT
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function Stats({ colors }) {
            const stats = [
                { label: "Tuition Fees", val: "₹0", color: colors.accent },
                { label: "Classes", val: "0-8", color: colors.secondary },
                { label: "Skill Focus", val: "3", color: colors.accent },
                { label: "Batch Type", val: "Evening", color: colors.secondary }
            ];
            return (
                <div className="flex flex-wrap justify-center gap-8 py-20">
                    {stats.map((s, i) => (
                        <div key={i} className="text-center">
                            <div className="text-4xl font-bold font-mono-cyber mb-1" style={{ color: s.color }}>{s.val}</div>
                            <div className="text-[10px] tracking-widest text-white/40 uppercase">{s.label}</div>
                        </div>
                    ))}
                </div>
            );
        }

        function BackgroundGrid({ color }) {
            return (
                <div className="fixed inset-0 pointer-events-none opacity-20 z-0">
                    <div className="absolute inset-0" style={{ 
                        backgroundImage: `linear-gradient(${color}11 1px, transparent 1px), linear-gradient(90deg, ${color}11 1px, transparent 1px)`,
                        backgroundSize: '40px 40px'
                    }} />
                    <div className="absolute inset-0 bg-radial-gradient from-transparent to-[#030014]" />
                </div>
            );
        }

        function Terminal({ colors }) {
            const [open, setOpen] = useState(false);
            const [input, setInput] = useState("");
            const buffer = useRef("");

            useEffect(() => {
                const handleKey = (e) => {
                    buffer.current = (buffer.current + e.key).slice(-8);
                    if (buffer.current.toLowerCase() === "abha2086") {
                        setOpen(true);
                        buffer.current = "";
                    }
                };
                window.addEventListener("keydown", handleKey);
                return () => window.removeEventListener("keydown", handleKey);
            }, []);

            if (!open) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md p-6">
                    <div className="w-full max-w-lg glass p-8 rounded-2xl border-2" style={{ borderColor: colors.accent }}>
                        <div className="flex justify-between mb-6 font-mono-cyber text-sm">
                            <span style={{ color: colors.accent }}>[SYSTEM_OVERRIDE]</span>
                            <button onClick={() => setOpen(false)}><Icon name="x" /></button>
                        </div>
                        <p className="mb-4">You've found the secret terminal. Enter decryption key for "Student Handbook".</p>
                        <input 
                            autoFocus
                            className="w-full bg-black/50 border border-white/10 p-3 rounded font-mono-cyber outline-none"
                            placeholder="Type 'DELHI' to unlock..."
                            value={input}
                            onChange={(e) => {
                                setInput(e.target.value);
                                if (e.target.value.toLowerCase() === 'delhi') {
                                    alert("Access Granted! Ask your teacher for the 2086 handbook.");
                                    setOpen(false);
                                    setInput("");
                                }
                            }}
                        />
                    </div>
                </div>
            );
        }

        function GravityVoid({ colors, onClose }) {
            return (
                <div className="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center p-6 text-center">
                    <div className="float text-6xl mb-8">🚀</div>
                    <h2 className="text-3xl font-bold mb-4">404: GRAVITY_LOST</h2>
                    <p className="text-white/50 max-w-md mb-8">You've drifted too far into the neural link. All learning nodes are currently floating.</p>
                    <button onClick={onClose} className="px-10 py-3 glass rounded-full" style={{ color: colors.accent }}>STABILIZE ENGINE</button>
                </div>
            );
        }

        function ControlDock({ colors, sync, setSync, onVoidTrigger }) {
            const audioCtx = useRef(null);
            
            const toggleSync = () => {
                if (!sync) {
                    // Initialize audio on first click
                    if (!audioCtx.current) {
                        audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = audioCtx.current.createOscillator();
                        const gain = audioCtx.current.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(110, audioCtx.current.currentTime);
                        gain.gain.setValueAtTime(0.01, audioCtx.current.currentTime);
                        osc.connect(gain);
                        gain.connect(audioCtx.current.destination);
                        osc.start();
                    } else {
                        audioCtx.current.resume();
                    }
                } else {
                    audioCtx.current?.suspend();
                }
                setSync(!sync);
            };

            return (
                <div className="fixed bottom-6 left-6 z-40 flex flex-col gap-2 font-mono-cyber text-[10px]">
                    <button onClick={toggleSync} className={`flex items-center gap-2 px-4 py-2 rounded-full glass transition-all ${sync ? 'border-cyan-400 text-cyan-400' : ''}`}>
                        <Icon name="sync" size={12} /> NEURAL SYNC {sync ? 'ON' : 'OFF'}
                    </button>
                    <button onClick={onVoidTrigger} className="flex items-center gap-2 px-4 py-2 rounded-full glass text-white/40 opacity-50 hover:opacity-100">
                        <Icon name="x" size={12} /> TRIGGER VOID
                    </button>
                </div>
            );
        }

        function FloatingAssistant({ colors }) {
            const [open, setOpen] = useState(false);
            return (
                <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-4">
                    {open && (
                        <div className="glass p-4 rounded-2xl mb-2 w-64 text-sm animate-in slide-in-from-bottom-4">
                            <p className="mb-3 font-bold" style={{ color: colors.accent }}>Assistant Alpha</p>
                            <p className="text-white/60 text-xs mb-4">Hello! I can help you with batch timings or contact info. Need help?</p>
                            <a href="tel:+916394254410" className="block w-full text-center py-2 bg-white/10 rounded-lg hover:bg-white/20 transition-colors">Call Admin</a>
                        </div>
                    )}
                    <button 
                        onClick={() => setOpen(!open)}
                        className="w-16 h-16 rounded-full flex items-center justify-center shadow-2xl transition-transform active:scale-95"
                        style={{ background: `linear-gradient(135deg, ${colors.accent}, ${colors.secondary})`, boxShadow: `0 0 20px ${colors.accent}44` }}
                    >
                        <Icon name={open ? "x" : "star"} size={24} color="black" />
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AbhaApp />);
    </script>
</body>
</html>
